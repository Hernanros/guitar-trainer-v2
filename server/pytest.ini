[pytest]
asyncio_mode = auto

# Both scopes must be session, and both must be set here rather than via a custom
# `event_loop` fixture (removed in pytest-asyncio 1.0, deprecated since 0.23).
#
# app/db/session.py builds its AsyncEngine at import time, and a pooled asyncpg
# connection is bound to the event loop that opened it. If fixtures and test bodies
# land on different loops — which is exactly what happens when only the fixture scope
# is session — a connection opened in a fixture is awaited from a loop that did not
# create it, and the run dies with "got Future attached to a different loop".
#
# asyncio_default_fixture_loop_scope arrived in pytest-asyncio 0.24 and
# asyncio_default_test_loop_scope in 0.26, so requirements-dev.txt floors at >=1.0.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

markers =
    live: hits a real external API and spends budget; run with -m "not live" to skip
